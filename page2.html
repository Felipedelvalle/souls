<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whac-A-Soul</title>
    <link rel="stylesheet" href="styles2.css">
</head>
<body>

<!-- Fade In Screen with Popup -->
<div id="fadeInScreen" class="fade-in">
  <img id="startPopup" src="tostart.gif" alt="Click to enter game">
</div>

    <!-- Game Content (Hidden initially) -->
    <div id="gameContent" class="hidden">
        <audio id="backgroundMusic" loop>
            <source src="music/smile.mp3" type="audio/mp3">
        </audio>

        <!-- Timer Bar -->
        <div id="timerBar" class="timer-bar">
            <div id="timerProgress" class="timer-progress"></div>
        </div>

        <!-- Countdown Images -->
        <div id="countdown" class="countdown">
            <img id="countdown3" src="3.png" class="countdown-img">
            <img id="countdown2" src="2.png" class="countdown-img">
            <img id="countdown1" src="1.png" class="countdown-img">
            <img id="countdownGo" src="go.gif" class="countdown-img">
        </div>

        <div class="game-container">
            <div id="scoreDisplay"> <span id="score">0</span></div>
            <div id="grid" class="grid"></div>
        </div>
    </div>

<!-- Game Over Popup -->
<div id="gameOverPopup" class="hidden">
  <img src="cow.png" alt="Game Over" class="popup-img">
  <h2>Game Over! <span id="finalScore"></span></h2>
  <button id="playAgainButton">
    <img src="buttonend1.png" alt="Play Again">
  </button>
  <button id="goToSiteButton">
    <img src="buttonend2.png" alt="Go to Site">
  </button>
</div>

    <script src="script2.js"></script>
</body>
</html>
